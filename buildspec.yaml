version: 0.2

phases:
pre_build:
commands:
- echo "Running Maven build..."
- mvn clean package
- echo "Logging in to Amazon ECR..."
- aws --version
- REPOSITORY_URI=240029899824.dkr.ecr.ap-south-1.amazonaws.com/contact-springboot-app
- aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 240029899824.dkr.ecr.ap-south-1.amazonaws.com
- IMAGE_TAG=latest

build:
commands:
- echo "Building Docker image..."
- docker build -t $REPOSITORY_URI:$IMAGE_TAG .

post_build:
commands:
- echo "Pushing Docker image to ECR..."
- docker push $REPOSITORY_URI:$IMAGE_TAG
- printf '[{"name":"contact-app-container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
files:
- imagedefinitions.json
